<div class="header">

  <button matIconButton type="button" (click)="onMenuClick()">
    <mat-icon>menu</mat-icon>
  </button>
  
  <mat-icon
   (click) = "goToInbox()"
    style="font-size: 36px; width: 36px; height: 36px; color: #006a6a;">email</mat-icon>

  <h1 (click)="goToInbox()">Kmail</h1>

  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Search mail</mat-label>
    <input matInput type="text" placeholder="Search mail" (input)="onSearch($event)" />
    <mat-icon matPrefix> search </mat-icon>
    <!-- matPrefix -- icon appears to left side  -->
  </mat-form-field>

  <div class="header-icons">

    <!-- HELP ICON & DROPDOWN  -->
    <button matIconButton type="button" [matMenuTriggerFor]="helpMenu">
      <mat-icon>help_outline</mat-icon>
    </button>
    <mat-menu #helpMenu="matMenu">
      <button mat-menu-item (click)="openQuickTips()">
        <mat-icon>help</mat-icon>
        <!-- <span>Help</span> -->
         <span>Quick tips</span>
      </button>

      <button mat-menu-item (click)="openTraining()">
        <mat-icon>school</mat-icon>
        <span>Training</span>
      </button>

      <button mat-menu-item (click)="openFeedback()">
        <mat-icon>feedback</mat-icon>
        <span>Send feedback</span>
      </button>
    </mat-menu>

    <!-- SETTINGS & DROPDOWN -->

    <button matIconButton type="button" [matMenuTriggerFor]="settingsMenu">
      <mat-icon>settings</mat-icon>
    </button>

    <mat-menu #settingsMenu="matMenu">

      <button mat-menu-item>
        <mat-icon>tune</mat-icon>
        <span>Quick settings</span>
      </button>

      <button mat-menu-item>
        <mat-icon>notifications</mat-icon>
        <span>Notifications</span>
      </button>

      <button mat-menu-item>
        <mat-icon>palette</mat-icon>
        <span>Theme</span>
      </button>

      <button mat-menu-item>
        <mat-icon>language</mat-icon>
        <span>Language</span>
      </button>

    </mat-menu>

    <!-- ACCOUNT -->
    <div class="account-area">

      <!-- USERNAME -->
      @if (userName) {
      <span class="username"> {{ userName }} </span>
      }

      <!-- Account icon  -->

      <!-- IF USER HAS PICTURE --DISPLAY IT 
       NO PICTURE --will display the first letter-->

      <button
         matIconButton
         type="button"
        [matMenuTriggerFor]="accountMenu"
        class="account-button">

        @if (profilePicture) {

      <img
      [src]="profilePicture"
      alt="Profile picture"
      class="header-profile-picture">

      } @else {   
              <span class="account-letter">
              {{ getFirstLetter() }}
              </span>
              }

      </button>

      <!-- dropdown menu -->
      <mat-menu #accountMenu="matMenu">
        <!-- Edit Profile-->
         <button mat-menu-item (click)="openProfile()">
           <mat-icon>person</mat-icon>
          <span>Edit Email</span>
        </button>

        <!-- PROFILE PICTURE -->

        @if (profilePicture) {
          <!-- UPDATE PROFILE PICTURE -->
       <button
         mat-menu-item
        (click)="openProfilePicture()">
        <mat-icon>photo_camera</mat-icon>
        <span>Update profile picture</span>
      </button>

      <!-- REMOVE PROFILE PICTURE -->
      <button
        mat-menu-item
        (click)="removeProfilePicture()"> 
        <mat-icon>delete</mat-icon>
        <span>Remove profile picture</span>
     </button>

      } @else {
         <!-- ADD PROFILE PICTURE -->
      <button
        mat-menu-item
        (click)="openProfilePicture()">
        <mat-icon>add_a_photo</mat-icon>
        <span>Add profile picture</span>
        </button>
      }

        <!-- ADD ACCOUNT -->
        <button mat-menu-item (click)="addAccount()">
            <mat-icon>person_add</mat-icon>
             <span>Add account</span>
        </button>

        <!-- FORGOT PASSWORD -->
        <button mat-menu-item (click)="openForgotPassword()">
          <mat-icon>lock_reset</mat-icon>
          <span>Forgot password</span>
        </button>
        
        <!-- logout -->
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
      <!-- <span>welcome {{ userName }}!</span> -->
    </div>

  </div>

</div>
